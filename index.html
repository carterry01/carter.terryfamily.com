<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carter's Games</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            width: 100%;
        }
        body {
            min-height: 100vh;
            min-width: 100vw;
            background: url('Carter.terryfamily.com/background.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .games-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            gap: 20px;
            margin-bottom: 40px;
        }
        .game-link {
            margin: 10px;
            padding: 20px;
            background: rgba(139, 0, 0, 0.7);
            color: white;
            text-decoration: none;
            font-size: 24px;
            border-radius: 10px;
            transition: all 0.3s;
            flex: 1;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .game-link:hover {
            background: rgba(255, 0, 0, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        }
        .empty-slot {
            background: rgba(139, 0, 0, 0.4);
            cursor: default;
        }
        .empty-slot:hover {
            background: rgba(139, 0, 0, 0.4);
            transform: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
    <link rel="stylesheet" href="Carter.terryfamily.com/notification.css">
    <script defer src="Carter.terryfamily.com/notification.js"></script>
</head>
<body>
    <div class="header">
        <h1>Hi!</h1>
        <h1>Welcome to My Games!</h1>
    </div>

    <h2 style="margin-bottom: 20px;">Games</h2>
    <div class="games-container">
        <a href="mining game/mine.html" class="game-link">Mining Game</a>
        <a href="penguin clicker/penguin clicker.html" class="game-link">Penguin Clicker</a>
        <a href="hang.html" class="game-link">Hang</a>
        <a href="HACKER TYPER.html" class="game-link">Hacker Typer</a>
        <a href="particles.html" class="game-link">Particles</a>
        <a href="neon-void.html" class="game-link">⚡ Neon Void</a>

        <a href="bloxd.html" class="game-link">🧱 Bloxd Clone</a>

        <a class="game-link empty-slot">Coming Soon</a>
        <a class="game-link empty-slot">Coming Soon</a>
    </div>
</body>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    showNotification('Welcome!', 'Thanks for visiting my games site.');
    showNotification("Reminder", "This will stay for 8 seconds!", 8000);
    showNotification("New Message", "You have a new notification!");
  });
</script>
</html>
