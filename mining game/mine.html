<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idle Mining Empire</title>
  <link rel="icon" type="image/png" href="../Carter.terryfamily.com/logo.png">
  <link rel="apple-touch-icon" href="../Carter.terryfamily.com/logo.png">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eaf6ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1000px 500px at 15% -5%, rgba(0, 255, 200, 0.14), transparent 60%),
        radial-gradient(900px 500px at 85% 10%, rgba(180, 80, 255, 0.16), transparent 60%),
        radial-gradient(700px 700px at 50% 110%, rgba(255, 120, 40, 0.12), transparent 60%),
        linear-gradient(180deg, #070b18 0%, #0b1030 45%, #120a2e 100%);
      position: relative;
      overflow-x: hidden;
    }
    /* mine tunnel glow + floating embers */
    body::before {
      content: '⛏️ 💎 🪨 💰 ⛏️ 💎 🪙 🌋';
      position: fixed;
      inset: auto 0 -30px 0;
      text-align: center;
      font-size: 64px;
      letter-spacing: 30px;
      opacity: 0.10;
      filter: blur(1px) saturate(1.4);
      pointer-events: none;
      animation: bgDrift 14s ease-in-out infinite alternate;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #00ffcc, transparent),
        radial-gradient(2px 2px at 70% 20%, #b450ff, transparent),
        radial-gradient(2px 2px at 40% 70%, #ffd700, transparent),
        radial-gradient(2px 2px at 85% 65%, #00e6ff, transparent),
        radial-gradient(2px 2px at 10% 80%, #ff7f50, transparent);
      background-size: 320px 320px;
      opacity: 0.5;
      animation: emberFloat 9s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes bgDrift {
      from { transform: translateX(-20px); }
      to { transform: translateX(20px); }
    }
    @keyframes emberFloat {
      from { background-position: 0 0; }
      to { background-position: 0 -320px; }
    }

    .back-link {
      color: #00ffcc;
      margin-bottom: 12px;
      text-decoration: none;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.8);
      z-index: 1;
    }
    .back-link:hover { text-decoration: underline; }

    h1 {
      margin: 6px 0 18px;
      font-size: 34px;
      letter-spacing: 1px;
      color: #fff;
      text-shadow:
        0 0 8px #00ffcc,
        0 0 24px #00ffcc,
        0 0 60px rgba(0, 255, 204, 0.6);
      animation: neonFlicker 4s infinite;
      z-index: 1;
      text-align: center;
    }
    @keyframes neonFlicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.75; }
      94% { opacity: 1; }
      96% { opacity: 0.85; }
      97% { opacity: 1; }
    }
    .subtitle {
      color: #9fd8ff;
      margin: -10px 0 18px;
      font-size: 14px;
      text-shadow: 0 0 10px rgba(0, 230, 255, 0.7);
      z-index: 1;
    }

    .game-container {
      background: rgba(12, 16, 38, 0.78);
      backdrop-filter: blur(10px);
      padding: 22px;
      border-radius: 18px;
      border: 1px solid rgba(0, 255, 204, 0.35);
      box-shadow:
        0 0 24px rgba(0, 255, 204, 0.25),
        0 0 80px rgba(180, 80, 255, 0.18),
        inset 0 0 40px rgba(0, 255, 204, 0.05);
      width: 360px;
      max-width: 94vw;
      z-index: 1;
      animation: fadeSlideIn 0.7s ease both;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      background: linear-gradient(90deg, rgba(0,255,204,0.08), rgba(180,80,255,0.08));
      border: 1px solid rgba(0, 255, 204, 0.16);
      border-left: 3px solid #00ffcc;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      animation: fadeSlideIn 0.5s ease both;
    }
    .stat span:last-child {
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.9);
    }

    .factory-layout {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 10px;
      margin-bottom: 18px;
      min-height: 60px;
    }

    .mine {
      height: 62px;
      font-size: 26px;
      background: linear-gradient(145deg, #1a2145, #0d1230);
      border: 1px solid rgba(0, 255, 204, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 14px rgba(0, 255, 204, 0.25);
      animation: minePop 0.35s ease both, glowPulse 2.6s ease-in-out infinite;
    }
    .mine:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 0 22px rgba(0, 255, 204, 0.65);
    }
    .mine:active { transform: scale(0.92); }
    @keyframes minePop {
      from { opacity: 0; transform: scale(0.6); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes glowPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }
    .mine.active { outline: 1px solid rgba(255,255,255,0.25); }
    .mine.gold {
      border-color: rgba(255, 215, 0, 0.7);
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.55);
      color: #222;
    }
    .mine.diamond {
      border-color: rgba(0, 230, 255, 0.8);
      box-shadow: 0 0 18px rgba(0, 230, 255, 0.6);
      color: #222;
    }
    .mine.wood {
      border-color: rgba(0, 255, 150, 0.55);
      box-shadow: 0 0 16px rgba(0, 255, 150, 0.4);
      color: #fff;
    }
    .mine.lava {
      border-color: rgba(255, 90, 0, 0.8);
      box-shadow: 0 0 20px rgba(255, 90, 0, 0.65);
      animation: minePop 0.35s ease both, lavaGlow 1.8s ease-in-out infinite;
      color: #fff;
    }
    @keyframes lavaGlow {
      0%, 100% { box-shadow: 0 0 14px rgba(255,90,0,0.5); }
      50% { box-shadow: 0 0 30px rgba(255,120,0,0.95); }
    }
    .mine.water {
      border-color: rgba(30, 144, 255, 0.8);
      box-shadow: 0 0 18px rgba(30, 144, 255, 0.6);
      color: #fff;
    }
    .mine.stone {
      border-color: rgba(180, 190, 255, 0.5);
      color: #fff;
    }

    .section-label {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7df9ff;
      text-shadow: 0 0 12px rgba(0, 230, 255, 0.8);
      margin: 14px 2px 2px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      position: relative;
      overflow: hidden;
      padding: 11px;
      background: linear-gradient(90deg, #00ffcc, #00b3ff);
      border: none;
      border-radius: 12px;
      color: #02131a;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 0 16px rgba(0, 255, 204, 0.45);
    }
    button::after {
      content: '';
      position: absolute;
      top: 0; left: -60%;
      width: 50%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent);
      transform: skewX(-20deg);
      animation: shimmer 3.2s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 60% { left: -60%; }
      100% { left: 130%; }
    }
    button:hover:not(:disabled) {
      filter: brightness(1.12);
      transform: translateY(-1px);
      box-shadow: 0 0 26px rgba(0, 255, 204, 0.75);
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { cursor: not-allowed; }
    .gold-btn {
      background: linear-gradient(90deg, #ffe45e, #ff9d00);
      box-shadow: 0 0 16px rgba(255, 200, 0, 0.5);
      color: #231600;
    }
    .gold-btn:hover:not(:disabled) { box-shadow: 0 0 26px rgba(255,200,0,0.8); }
    .diamond-btn {
      background: linear-gradient(90deg, #7df9ff, #4d7cff);
      box-shadow: 0 0 16px rgba(0, 200, 255, 0.55);
      color: #04122b;
    }
    .diamond-btn:hover:not(:disabled) { box-shadow: 0 0 26px rgba(0,200,255,0.85); }
    .overworld-btn {
      background: linear-gradient(90deg, #3a4670, #232b52);
      color: #dff6ff;
      border: 1px solid rgba(0, 255, 204, 0.3);
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
    }
    .overworld-btn:hover:not(:disabled) {
      background: linear-gradient(90deg, #4a588a, #2c3766);
      box-shadow: 0 0 22px rgba(0, 255, 204, 0.45);
    }

    /* Full-screen, no page scroll */
    html, body { height: 100dvh; overflow: hidden; }
    body { padding: 10px 12px; justify-content: flex-start; }
    h1 { font-size: 24px; margin: 2px 0 2px; }
    .subtitle { display: none; }
    .back-link { margin-bottom: 6px; font-size: 14px; }
    .game-container {
      width: min(1180px, 98vw);
      height: calc(100dvh - 64px);
      display: grid;
      grid-template-columns: 290px 190px 1fr;
      gap: 12px;
      overflow: hidden;
      padding: 14px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 0;
      overflow: hidden;
      align-content: start;
    }
    .stat { padding: 6px 8px; font-size: 12px; border-radius: 8px; }
    .factory-layout {
      margin: 0;
      overflow: hidden;
      grid-template-columns: repeat(2, 1fr);
      align-content: start;
      min-height: 0;
    }
    .mine { height: 52px; font-size: 22px; }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 0;
      overflow-y: auto;
      overflow-x: hidden;
      align-content: start;
      min-height: 0;
      padding-right: 2px;
    }
    .section-label { grid-column: 1 / -1; margin: 4px 2px 0; font-size: 11px; }
    .buttons button { padding: 8px 6px; font-size: 12px; border-radius: 10px; }
    @media (max-width: 900px) {
      .game-container { grid-template-columns: 1fr 1fr; }
      .buttons { grid-column: 1 / -1; grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      h1 { font-size: 20px; }
      .game-container { grid-template-columns: 1fr; height: calc(100dvh - 58px); }
      .stats { grid-template-columns: 1fr 1fr; }
      .factory-layout { grid-template-columns: repeat(3, 1fr); }
      .buttons { grid-column: auto; grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back-link">← Back to Games</a>
  <h1>⛏️ Mining Empire</h1>
  <div class="subtitle">neon depths • click to extract • no auto-gen</div>

  <div class="game-container">
    <div class="stats" id="stats">
      <!-- Overworld stats first -->
      <div class="stat"><span>Wood:</span> <span id="wood">0</span></div>
      <div class="stat"><span>Lava:</span> <span id="lava">0</span></div>
      <div class="stat"><span>Water:</span> <span id="water">0</span></div>
      <div class="stat"><span>Stone:</span> <span id="stone">0</span></div>
      <div class="stat"><span>Wood Mines:</span> <span id="woodMines">0</span></div>
      <div class="stat"><span>Lava Mines:</span> <span id="lavaMines">0</span></div>
      <div class="stat"><span>Water Mines:</span> <span id="waterMines">0</span></div>
      <div class="stat"><span>Stone Mines:</span> <span id="stoneMines">0</span></div>
      <!-- Underground stats next -->
      <div class="stat"><span>Ore:</span> <span id="ore">0</span></div>
      <div class="stat"><span>Gold:</span> <span id="gold">0</span></div>
      <div class="stat"><span>Diamond:</span> <span id="diamond">0</span></div>
      <div class="stat"><span>Money:</span> <span id="money">0</span></div>
      <div class="stat"><span>Ore Mines:</span> <span id="mines">0</span></div>
      <div class="stat"><span>Gold Mines:</span> <span id="goldMines">0</span></div>
      <div class="stat"><span>Diamond Mines:</span> <span id="diamondMines">0</span></div>
    </div>

    <div class="factory-layout" id="factory-layout">
      <!-- mines appear here once bought. Click a mine to collect -->
    </div>

    <div class="buttons" id="buttons">
      <div class="section-label">✋ Collect</div>
      <!-- Click to collect: needs the mine, gives +1 per mine owned -->
      <button class="overworld-btn" id="gatherWoodBtn" onclick="gather('wood')">🪓 Chop Wood</button>
      <button class="overworld-btn" id="gatherWaterBtn" onclick="gather('water')">💧 Collect Water</button>
      <button class="overworld-btn" id="gatherStoneBtn" onclick="gather('stone')">🪨 Gather Stone</button>
      <button class="overworld-btn" id="gatherLavaBtn" onclick="gather('lava')">🌋 Scoop Lava</button>
      <button id="gatherOreBtn" onclick="gather('ore')">⛏️ Dig Ore</button>
      <button class="gold-btn" id="gatherGoldBtn" onclick="gather('gold')">🥇 Pick Gold</button>
      <button class="diamond-btn" id="gatherDiamondBtn" onclick="gather('diamond')">💎 Hunt Diamond</button>
      <div class="section-label">💰 Sell</div>
      <!-- Overworld sells (price = label) -->
      <button class="overworld-btn" onclick="sellWater()">Sell Water (+$1 each)</button>
      <button class="overworld-btn" onclick="sellWood()">Sell Wood (+$10 each)</button>
      <button class="overworld-btn" onclick="sellStone()">Sell Stone (+$100 each)</button>
      <button class="overworld-btn" onclick="sellLava()">Sell Lava (+$1,000 each)</button>
      <div class="section-label">🏗️ Buy mines</div>
      <button class="overworld-btn" id="buyWaterMineBtn" onclick="buyWaterMine()">Buy Water Mine</button>
      <button class="overworld-btn" id="buyWoodMineBtn" onclick="buyWoodMine()">Buy Wood Mine</button>
      <button class="overworld-btn" id="buyLavaMineBtn" onclick="buyLavaMine()">Buy Lava Mine</button>
      <button class="overworld-btn" id="buyStoneMineBtn" onclick="buyStoneMine()">Buy Stone Mine</button>
      <!-- Underground sells (price = label) -->
      <button id="sellOreBtn" onclick="sellOre()">Sell Ore (+$1,000 each)</button>
      <button class="gold-btn" id="sellGoldBtn" onclick="sellGold()">Sell Gold (+$5,000 each)</button>
      <button class="diamond-btn" id="sellDiamondBtn" onclick="sellDiamond()">Sell Diamond (+$10,000 each)</button>
      <button id="buyOreMineBtn" onclick="buyMine()">Buy Ore Mine</button>
      <button class="gold-btn" id="buyGoldMineBtn" onclick="buyGoldMine()">Buy Gold Mine</button>
      <button class="diamond-btn" id="buyDiamondMineBtn" onclick="buyDiamondMine()">Buy Diamond Mine</button>
    </div>
  </div>

  <script>
    // Overworld resources
    let wood = 0, lava = 0, water = 0, stone = 0;
    let woodMines = 0, lavaMines = 0, waterMines = 0, stoneMines = 0;

    // Underground resources
    let ore = 0;
    let gold = 0;
    let diamond = 0;
    let oreMines = 0;
    let goldMines = 0;
    let diamondMines = 0;

    let money = 100;

    // Base costs — each extra mine of the same type costs more (base * (owned + 1))
    const BASE_COST = { water: 10, wood: 100, stone: 500, lava: 1000, ore: 1500, gold: 5500, diamond: 15000 };
    // Sell prices — kept in one place so labels and logic always match
    const SELL_PRICE = { wood: 10, lava: 1000, water: 1, stone: 100, ore: 1000, gold: 5000, diamond: 10000 };

    function ownedCount(type) {
      if (type === 'wood') return woodMines;
      if (type === 'lava') return lavaMines;
      if (type === 'water') return waterMines;
      if (type === 'stone') return stoneMines;
      if (type === 'ore') return oreMines;
      if (type === 'gold') return goldMines;
      if (type === 'diamond') return diamondMines;
      return 0;
    }

    function mineCost(type) {
      return BASE_COST[type] * (ownedCount(type) + 1);
    }

    // No free mines: you only auto-generate what you buy.
    // Each mine is an object: {type: 'wood'|'lava'|'water'|'stone'|'ore'|'gold'|'diamond', active: true}
    let factoryLayout = [];

    function addResource(type, n) {
      if (type === 'ore') ore += n;
      else if (type === 'gold') gold += n;
      else if (type === 'diamond') diamond += n;
      else if (type === 'wood') wood += n;
      else if (type === 'lava') lava += n;
      else if (type === 'water') water += n;
      else if (type === 'stone') stone += n;
    }

    // Manual click: only works if you own the mine; gives +1 per mine owned
    function gather(type) {
      const n = ownedCount(type);
      if (n <= 0) return;
      addResource(type, n);
      updateUI();
    }

    // Click a mine tile to collect: +1 per mine you own of that type
    function clickMine(index) {
      const mine = factoryLayout[index];
      if (!mine) return;
      const n = ownedCount(mine.type);
      if (n <= 0) return;
      addResource(mine.type, n);
      updateUI();
    }

    function updateGatherLabels() {
      const set = (id, label, enabled) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = label;
        el.disabled = !enabled;
        el.style.opacity = enabled ? '1' : '0.5';
      };
      const names = { wood: '🪓 Chop Wood', water: '💧 Collect Water', stone: '🪨 Gather Stone', lava: '🌋 Scoop Lava', ore: '⛏️ Dig Ore', gold: '🥇 Pick Gold', diamond: '💎 Hunt Diamond' };
      const ids = { wood: 'gatherWoodBtn', water: 'gatherWaterBtn', stone: 'gatherStoneBtn', lava: 'gatherLavaBtn', ore: 'gatherOreBtn', gold: 'gatherGoldBtn', diamond: 'gatherDiamondBtn' };
      for (const type of Object.keys(names)) {
        const n = ownedCount(type);
        const label = n > 0 ? `${names[type]} (+${n})` : `${names[type]} (need mine)`;
        set(ids[type], label, n > 0);
      }
    }

    function updateBuyLabels() {
      const set = (id, label) => { const el = document.getElementById(id); if (el) el.textContent = label; };
      set('buyWaterMineBtn', `Buy Water Mine ($${mineCost('water').toLocaleString()})`);
      set('buyWoodMineBtn', `Buy Wood Mine ($${mineCost('wood').toLocaleString()})`);
      set('buyStoneMineBtn', `Buy Stone Mine ($${mineCost('stone').toLocaleString()})`);
      set('buyLavaMineBtn', `Buy Lava Mine ($${mineCost('lava').toLocaleString()})`);
      set('buyOreMineBtn', `Buy Ore Mine ($${mineCost('ore').toLocaleString()})`);
      set('buyGoldMineBtn', `Buy Gold Mine ($${mineCost('gold').toLocaleString()})`);
      set('buyDiamondMineBtn', `Buy Diamond Mine ($${mineCost('diamond').toLocaleString()})`);
    }

    function updateUI() {
      // Overworld
      document.getElementById("wood").textContent = wood;
      document.getElementById("lava").textContent = lava;
      document.getElementById("water").textContent = water;
      document.getElementById("stone").textContent = stone;
      document.getElementById("woodMines").textContent = woodMines;
      document.getElementById("lavaMines").textContent = lavaMines;
      document.getElementById("waterMines").textContent = waterMines;
      document.getElementById("stoneMines").textContent = stoneMines;
      // Underground
      document.getElementById("ore").textContent = ore;
      document.getElementById("gold").textContent = gold;
      document.getElementById("diamond").textContent = diamond;
      document.getElementById("money").textContent = money;
      document.getElementById("mines").textContent = oreMines;
      document.getElementById("goldMines").textContent = goldMines;
      document.getElementById("diamondMines").textContent = diamondMines;

      updateFactoryLayout();
      updateBuyLabels();
      updateGatherLabels();
    }

    function updateFactoryLayout() {
      const layout = document.getElementById("factory-layout");
      layout.innerHTML = '';
      if (factoryLayout.length === 0) {
        layout.innerHTML = '<div style="grid-column:1/-1;color:#aaa;font-size:14px;">No mines yet — buy one below. You start with $100. Nothing auto-generates; clicking collects +1 per mine you own.</div>';
        return;
      }
      factoryLayout.forEach((mine, i) => {
        const mineDiv = document.createElement('div');
        mineDiv.classList.add('mine');
        if (mine.type === 'gold') mineDiv.classList.add('gold');
        if (mine.type === 'diamond') mineDiv.classList.add('diamond');
        if (mine.type === 'wood') mineDiv.classList.add('wood');
        if (mine.type === 'lava') mineDiv.classList.add('lava');
        if (mine.type === 'water') mineDiv.classList.add('water');
        if (mine.type === 'stone') mineDiv.classList.add('stone');
        if (mine.active) mineDiv.classList.add('active');
        if (mine.type === 'ore') mineDiv.textContent = '⛏️';
        else if (mine.type === 'gold') mineDiv.textContent = '🥇';
        else if (mine.type === 'diamond') mineDiv.textContent = '💎';
        else if (mine.type === 'wood') mineDiv.textContent = '🌲';
        else if (mine.type === 'lava') mineDiv.textContent = '🌋';
        else if (mine.type === 'water') mineDiv.textContent = '💧';
        else if (mine.type === 'stone') mineDiv.textContent = '🪨';
        mineDiv.title = `Click to collect +${ownedCount(mine.type)}`;
        mineDiv.onclick = () => clickMine(i);
        layout.appendChild(mineDiv);
      });
    }

    // Overworld sell functions (price comes from SELL_PRICE so label == payout)
    function sellWood() {
      if (wood > 0) {
        money += wood * SELL_PRICE.wood;
        wood = 0;
        updateUI();
      }
    }
    function sellLava() {
      if (lava > 0) {
        money += lava * SELL_PRICE.lava;
        lava = 0;
        updateUI();
      }
    }
    function sellWater() {
      if (water > 0) {
        money += water * SELL_PRICE.water;
        water = 0;
        updateUI();
      }
    }
    function sellStone() {
      if (stone > 0) {
        money += stone * SELL_PRICE.stone;
        stone = 0;
        updateUI();
      }
    }

    // Underground sell functions: ore $1,000 / gold $5,000 / diamond $10,000
    function sellOre() {
      if (ore > 0) {
        money += ore * SELL_PRICE.ore;
        ore = 0;
        updateUI();
      }
    }
    function sellGold() {
      if (gold > 0) {
        money += gold * SELL_PRICE.gold;
        gold = 0;
        updateUI();
      }
    }
    function sellDiamond() {
      if (diamond > 0) {
        money += diamond * SELL_PRICE.diamond;
        diamond = 0;
        updateUI();
      }
    }

    // Overworld buy functions — cost scales: base * (owned + 1)
    function buyWoodMine() {
      const cost = mineCost('wood');
      if (money >= cost) {
        woodMines += 1;
        money -= cost;
        factoryLayout.push({type: 'wood', active: true});
        updateUI();
      }
    }
    function buyLavaMine() {
      const cost = mineCost('lava');
      if (money >= cost) {
        lavaMines += 1;

    // Underground buy functions: ore $1,500 / gold $5,500 / diamond $15,000 base, scaling up
    function buyMine() {
